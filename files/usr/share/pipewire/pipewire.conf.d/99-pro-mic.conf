# "Pro Mic (M8)" — processed capture chain for the USB M8 microphone.
# Chain: rumble filter -> RNNoise -> gate -> EQ -> compressor/limiter
# Shows up as its own source called "Pro Mic (M8)"; the raw mic stays untouched.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Pro Mic (M8)"
            media.name       = "Pro Mic (M8)"
            filter.graph = {
                nodes = [
                    # Desk thumps and keyboard shock through the stand live below ~85Hz
                    { type = builtin name = rumble label = bq_highpass
                        control = { "Freq" = 85 "Q" = 0.707 } }

                    # RNNoise: the heavy lifting on keyboard clatter. A high VAD
                    # threshold means more aggressive muting between words, where
                    # most key clicks happen. Retroactive grace keeps word attacks.
                    { type = ladspa name = rnnoise plugin = /usr/lib64/ladspa/librnnoise_ladspa.so
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)"          = 60
                            "VAD Grace Period (ms)"      = 180
                            "Retroactive VAD Grace (ms)" = 40
                        } }

                    # Backstop gate for stray clicks that survive RNNoise
                    { type = ladspa name = gate plugin = /usr/lib64/ladspa/caps.so label = Noisegate
                        control = { "open (dB)" = -38 "attack (ms)" = 1 "close (dB)" = -50 "mains (Hz)" = 50 } }

                    # Voicing EQ: scoop boxiness, lift presence, a little air
                    { type = builtin name = mud      label = bq_peaking
                        control = { "Freq" = 250  "Q" = 1.0   "Gain" = -3.0 } }
                    { type = builtin name = presence label = bq_peaking
                        control = { "Freq" = 3200 "Q" = 0.9   "Gain" = 3.0 } }
                    { type = builtin name = air      label = bq_highshelf
                        control = { "Freq" = 8000 "Q" = 0.707 "Gain" = 2.0 } }

                    # Levelling + saturating limiter, so shouting never clips
                    { type = ladspa name = comp plugin = /usr/lib64/ladspa/caps.so label = Compress
                        control = {
                            "measure"   = 0
                            "mode"      = 1
                            "threshold" = 0.35
                            "strength"  = 0.55
                            "attack"    = 0.6
                            "release"   = 0.5
                            "gain (dB)" = 6
                        } }
                ]
                links = [
                    { output = "rumble:Out"      input = "rnnoise:Input" }
                    { output = "rnnoise:Output"  input = "gate:in" }
                    { output = "gate:out"        input = "mud:In" }
                    { output = "mud:Out"         input = "presence:In" }
                    { output = "presence:Out"    input = "air:In" }
                    { output = "air:Out"         input = "comp:in" }
                ]
                inputs  = [ "rumble:In" ]
                outputs = [ "comp:out" ]
            }
            capture.props = {
                node.name      = "pro_mic_capture"
                node.passive   = true
                target.object  = "alsa_input.usb-M8_c1_M8-00.mono-fallback"
                audio.position = [ MONO ]
            }
            playback.props = {
                node.name      = "pro_mic"
                media.class    = Audio/Source
                audio.position = [ MONO ]
            }
        }
    }
]
